name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest -q

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Golden suite under two hash seeds
        run: |
          PYTHONHASHSEED=1 pytest -q tests/test_e2e.py
          PYTHONHASHSEED=2 pytest -q tests/test_e2e.py

      - name: Byte-compare emitted output across the two seeds
        run: |
          PYTHONHASHSEED=1 python tests/emit_fixtures.py "$RUNNER_TEMP/seed-1"
          PYTHONHASHSEED=2 python tests/emit_fixtures.py "$RUNNER_TEMP/seed-2"
          diff -ru "$RUNNER_TEMP/seed-1" "$RUNNER_TEMP/seed-2"

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Verilator (D17 - a smoke test, version freshness irrelevant)
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Clone the corpus repos (D14, shallow)
        run: |
          git clone --depth 1 https://github.com/YosysHQ/picorv32 "$RUNNER_TEMP/corpus/picorv32"
          git clone --depth 1 https://github.com/olofk/serv "$RUNNER_TEMP/corpus/serv"

      - name: picorv32 - init --yes, strict-valid, MultipleTops warning asserted
        run: python tests/corpus.py "$RUNNER_TEMP/corpus/picorv32" --expect-warning MultipleTops

      - name: serv - init --yes, strict-valid
        run: python tests/corpus.py "$RUNNER_TEMP/corpus/serv"

      - name: serv - init --top serv_top, buildable under Verilator
        run: >
          python tests/corpus.py "$RUNNER_TEMP/corpus/serv"
          --top serv_top --subdir autocore_verilator --verilate
